<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
    <style>
        body {
            width: 300px;
            padding: 15px;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
        }
        button {
            padding: 10px 20px;
            margin: 10px 5px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        button#downloadBtn {
            background-color: #2196F3;
        }
        button#downloadBtn:hover {
            background-color: #0b7dda;
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }
        .success {
            background-color: #dff0d8;
            color: #3c763d;
            display: block;
        }
        .error {
            background-color: #f2dede;
            color: #a94442;
            display: block;
        }
        .info {
            background-color: #d9edf7;
            color: #31708f;
            display: block;
        }
        .settings-link {
            margin-top: 15px;
            color: #2196F3;
            cursor: pointer;
            font-size: 12px;
        }
        .settings-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h3>GitHub书签同步</h3>
        <button id="uploadBtn">上传到GitHub</button>
        <button id="downloadBtn">从GitHub下载</button>
        <div class="message" id="message"></div>
        <div class="settings-link" id="settingsLink">设置</div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
