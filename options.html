<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
    <style>
        body {
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }
        .success {
            background-color: #dff0d8;
            color: #3c763d;
            display: block;
        }
        .error {
            background-color: #f2dede;
            color: #a94442;
            display: block;
        }
    </style>
</head>
<body>
    <h2>书签同步设置</h2>
    
    <div class="form-group">
        <label for="apiBase">Cloudflare Worker API地址</label>
        <input type="url" id="apiBase" placeholder="例如: https://your-worker.example.workers.dev">
    </div>
    
    <div class="form-group">
        <label for="authToken">认证Token</label>
        <input type="text" id="authToken" placeholder="用于验证请求的Token">
    </div>
    
    <button id="saveBtn">保存设置</button>
    <div class="message" id="message"></div>
    
    <script src="options.js"></script>
</body>
</html>
